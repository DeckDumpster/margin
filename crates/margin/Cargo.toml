[package]
name = "margin"
version = "0.1.0"
edition.workspace = true

[dependencies]
margin-core = { path = "../margin-core" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time", "fs"] }
tower-http = { version = "0.6", features = ["timeout"] }
rusqlite = { version = "0.37", features = ["bundled"] }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "html", "regex-fancy"] }
askama = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
getrandom = "0.3"
opentelemetry-proto = { version = "0.30", default-features = false, features = ["gen-tonic-messages", "metrics"] }
prost = "0.13"
ureq = { version = "3", default-features = false }
flate2 = "1"
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
margin-test-id = { path = "../margin-test-id" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[features]
integration = []

[[test]]
name = "http"
path = "tests/http.rs"
required-features = ["integration"]

[[test]]
name = "feed"
path = "tests/feed.rs"
required-features = ["integration"]

[[test]]
name = "deploy"
path = "tests/deploy.rs"
required-features = ["integration"]
