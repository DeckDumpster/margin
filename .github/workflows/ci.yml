name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    container: docker.io/library/rust:1.99.1-bookworm
    steps:
      - uses: actions/checkout@v4
      # A push to main comes from the landing queue, which lands only a commit whose gate passed
      # locally on that exact tree; the push builds and ships it and does not test it again.
      - run: bash gate.sh
        if: github.event_name != 'push'
      - uses: actions/cache@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Build the release binary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MARGIN_BUILD_SHA: ${{ github.sha }}
        run: cargo build --release --locked -p margin
      - name: Upload the binary the deploy will install
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: margin-${{ github.sha }}
          path: target/release/margin
          if-no-files-found: error
