# Rows `work checks` runs before a branch is submitted. Each budget is the measured warm time
# (fmt 4.6 s, clippy 4.6 s, unit 11.6 s) with room for a cold build of the dependencies.
[[check]]
name = "fmt"
run = "cargo fmt --all --check"
budget_ms = 30000

[[check]]
name = "clippy"
run = "cargo clippy --workspace --all-targets -- -D warnings"
budget_ms = 300000

[[check]]
name = "unit"
run = "cargo test --workspace --all-targets"
budget_ms = 600000
